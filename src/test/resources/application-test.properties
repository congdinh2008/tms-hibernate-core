# Test Database Configuration
hibernate.connection.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=true
hibernate.format_sql=true

# Disable cache for testing
hibernate.cache.use_second_level_cache=false
hibernate.cache.use_query_cache=false

# Test logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.transaction=DEBUG

# Connection pool settings for testing
hibernate.hikari.minimumIdle=5
hibernate.hikari.maximumPoolSize=10
hibernate.hikari.connectionTimeout=20000
hibernate.hikari.idleTimeout=300000
hibernate.hikari.maxLifetime=1200000
hibernate.hikari.leakDetectionThreshold=60000

# Test-specific settings
spring.profiles.active=test
test.database.cleanup=true
